name: Local server release

# Builds the server bundle the desktop client runs on the player's machine and attaches it to the
# release. The lobby points clients at
# https://github.com/Apptive-Game-Team/ArcaneCastersGame/releases/download/v{version}/local-server-{platform}.zip
# (root plan, local hosting contracts, section 2), so the tag must be v + the version in build.gradle.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  local-server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      # localServerDist checks every archive against its pinned sha256 before using it, so a cache
      # hit can only skip the download, never change what is linked.
      - name: Cache the platform JDKs
        uses: actions/cache@v4
        with:
          path: build/local-server/jdk-cache
          key: local-server-jdk-${{ hashFiles('gradle/local-server-dist.gradle') }}

      - name: Build the bundles
        run: ./gradlew localServerDist --no-daemon

      - name: Check the tag matches the bundled version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(cat build/local-server/VERSION)"
          if [ "$TAG" != "v$version" ]; then
            echo "Release tag $TAG does not match build.gradle version $version" >&2
            exit 1
          fi

      - name: Upload the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" \
            build/local-server/local-server-windows-x64.zip \
            build/local-server/local-server-windows-x64.zip.sha256 \
            build/local-server/local-server-macos-x64.zip \
            build/local-server/local-server-macos-x64.zip.sha256 \
            build/local-server/local-server-macos-arm64.zip \
            build/local-server/local-server-macos-arm64.zip.sha256 \
            build/local-server/local-server-linux-x64.zip \
            build/local-server/local-server-linux-x64.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber
