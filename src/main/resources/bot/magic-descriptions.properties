# What each magic does, copied from the client's English magic book
# (client Assets/Localization/MagicBook_en.asset, keyed by magic name) by
# scripts/sync-magic-descriptions.py. Edit the client table, not this file.
aqua_archer=Summons a water slime archer that walks toward the nearest enemy and shoots it from range. It can hit ground units, flying units, buildings and the enemy base.
bean_shooter=Summons a ground unit that shoots beans in a straight line at the closest ground enemy. A bean hits the first ground enemy in its path and cannot hit air units.
bomb_sprite=Summons a flying sprite that flies over ground enemies and drops bombs on them, which explode where they land and hurt nearby ground enemies. It ignores air targets and does not die when attacking.
boulder_strike=Hurls a boulder that hits the first enemy in its path, knocking it back and stunning it briefly. If the pushed enemy slams into a wall, a rock remnant, or another enemy, it takes extra damage, and so does that enemy.
bubble_generator=Builds a bubble generator that wraps the nearest ally in reach in a bubble that blocks the next hit it takes. It skips allies that already have a bubble, never attacks, and fades after a while.
bubble_spirit=Summons a flying water slime that only targets flying enemies. It floats toward the nearest one and shoots bursting bubbles that also hurt other flyers next to the target. It never attacks ground units, buildings or the base.
cannon=Builds a human arcane cannon that shells the closest ground enemy in range, buildings and the enemy base included. It cannot hit flying units, and it leaves rubble that blocks ground movement when destroyed.
chain_lightning=Fires a lightning bolt that strikes the first enemy it touches and briefly stuns it, then jumps to another nearby enemy it has not hit yet, dealing less damage with each jump up to a limited number of enemies. Only the first strike is blocked by what is in its path; later jumps can reach nearby flying units.
chicken_commando=Deploys a paratrooper of the human magic civilization on the target point who cannot act until it lands, then walks to the nearest ground enemy and fights it in melee. It cannot attack flying units.
cloud_dragon=Summons a flying cloud dragon that shoots the nearest enemy, ground or air, from range, and wets every unit around it, which puts out burning. Now and then it looses a chain lightning that stuns the first enemy it hits and jumps on to others for less damage each time.
crater=Leaves an ember crater that can be attacked and spits fireballs in random directions. A fireball damages the first enemy it touches, otherwise it lands and leaves a fire patch that burns anything standing on it, your own units too.
dimension_toad=Summons a toad that never attacks. It walks toward the nearest enemy building or base and keeps its distance, runs from enemy ground units that come close, and releases fire and lightning tadpoles in turn, starting at once. Tadpoles are short-lived melee ground fighters.
dragon_tower=Builds a tower that keeps firing burning flame shots straight toward the enemy side, hitting the first ground enemy in the line and burning it. It does not aim, and it expires after a while.
earth_call=Shakes the ground at the chosen spot and raises every rock remnant there, from either side, into your own units: small remnants into mini rocks and medium remnants into rock golems. It does nothing without remnants.
electric_tower=Builds a tower that zaps the nearest enemy in reach, ground or flying, then arcs to a few more nearby enemies for less damage. The tower can be attacked and fades after a while.
ember_spirit_swarm=Summons a swarm of small ember demons that walk to the nearest ground target and hit it in melee, but cannot attack flying units. Their trail leaves burning fields that scorch any non-fire unit that steps in, your own included.
evil_ent=Summons a slow ground giant that punches enemies from range. When a light enemy comes within reach, it drags that enemy in, stuns it, and burns it with a fire fist.
fire_lord_spirit=Summons a flying Hellfire Legion commander that never attacks itself: it drifts toward the nearest enemy and stops at a distance. Every few seconds it sends out a flying lesser demon that shoots ground and flying targets, up to a limited number in total.
fire_shot=Fires a hellfire projectile in the target direction that explodes on the first enemy unit, building or base it touches, damaging enemies around the impact and setting the one it hit on fire. Flying units are out of its reach.
fire_spirit=Summons lesser demons that walk to the nearest ground enemy and spray flames in a line, burning whatever they hit. Their fiery aura also burns every nearby unit that is not fire, your own included.
firework_tower=Builds a tower that keeps lobbing fireworks onto a fixed spot ahead of it toward the enemy side, exploding on arrival and hurting enemies there. It does not aim and expires after a while.
frenzy_totem=Drops a totem that lands at the target point and throws units around it into a frenzy for a short time: they attack the nearest unit of either side, allies included, and attack faster. It affects your units as well as the enemy's.
grass_generator=Builds a structure that keeps growing leaf fields around it, which snare enemies and heal allies. Allied seed spirits near it sprout vines that hurt nearby enemies.
healing_totem=Places a healing totem that heals your own units, buildings and base within its reach at regular intervals, flying units included. If it is placed on top of a friendly unit it follows that unit, and it fades after a while.
leafair=Drops a leaf fairy that heals the first allied unit, building or base it touches and restarts the lifetime of allied buildings that expire. If it touches an enemy first, it damages and snares that enemy instead.
life_tree=Plants a World Tree sapling that heals your ground units, buildings and base standing close to it at regular intervals. It withers after a while, and enemies can destroy it sooner.
lightning_drop=Calls down lightning on a narrow column at the target point at once and twice more after short pauses, hitting every enemy in the column on the ground or in the air. Your own lightning units in the column are charged instead, and each strike leaves a brief electric field that stuns non-lightning units that enter it.
lightning_explosion=Detonates a lightning charge on the target point after a short delay, shocking enemies in the area so they cannot act. It damages every ground unit, building and base in the area, your own included.
magma_explosion=Opens a magma rift at the target point that erupts after a short delay, damaging every unit and building in the area, your own included, and setting enemies on fire. Flying units are out of reach.
magma_spirit=Summons a heavy magma demon that, on reaching a ground enemy, slams a burst of fire onto its position that damages and burns every enemy around it. It cannot target flying units, its aura burns every nearby unit that is not fire, and it leaves rubble when it falls.
mana_well=Opens a well that speeds up your mana regeneration for as long as it stands. Enemies can destroy it, and it dries up on its own after a while.
meteor_shower=Rains meteors at random spots around the target point for several seconds. Each meteor falls from the sky and hits only the first enemy it touches, on the ground or in the air, and a meteor that touches nothing is wasted.
mini_rock_swarm=Summons small rock golems that slowly walk to the nearest ground target and hit it in melee. They are sturdy but cannot attack flying units.
overgrowth=Bursts roots out of the target point after a short delay, damaging and slowing enemies in the area. Your seed spirits in the area grow into tree golems; if there are none, it summons new seed spirits there instead.
rain_cloud=Summons a cloud that rains over the battlefield.
rallying_totem=Drops a beacon on the target point that stands for a while and cannot be attacked. Allies within a wide reach stop advancing and gather around it, fighting only enemies that come near, and they attack faster while close to it.
razor_gale=Spins up a razor gale on the target point that lasts a few seconds and cuts everything in the area again and again, your own units and buildings included.
repair_totem=Builds a totem that pauses the countdown of nearby allied buildings so they last longer while they stay in range. It does not heal them.
rock_blast=Detonates every rock remnant in the area, from either side, after a short delay, with each explosion hurting everything near it, your own units too. Medium remnants leave a small remnant behind.
rock_drop=Drops a boulder from the sky that takes a moment to fall, then damages only the first enemy it touches, ground or flying. It deals no area damage and does nothing if no enemy is under it.
rock_golem=Summons a mossy rock golem that walks to the nearest ground enemy and punches it, pushing it back a little. It cannot hit flying units, and it leaves rubble that blocks ground movement when it falls.
rock_mage=Summons a rune-stone shaman of the rock golem tribe that walks toward the nearest enemy and throws two rocks per attack, one at each of the two closest enemies in range, or both at one if it is alone. It hits ground and flying targets alike.
rock_rolling=Rolls a heavy boulder along the ground that damages every enemy it touches and bounces off enemies and the field walls. It disappears after a few bounces and cannot hit flying units.
rock_turret=Builds a small stationary turret that hurls rocks at the nearest enemy ground unit, building or base within its reach, and it cannot hit flying units. It crumbles after a short time, and enemies can destroy it sooner.
sand_storm=Whips up a dust storm at the target point that lingers and keeps damaging every enemy standing inside it. It only reaches ground enemies.
sea_serpent=Summons a slow ground serpent that leaves water fields along its path. It fires a water beam that hits every enemy standing in a line, flying ones included.
seed_nest=Builds a nest that spawns a ground seed spirit at regular intervals until the nest expires or is destroyed. Seed spirits fight in melee and leave leaf fields behind as they walk.
seed_spirit_swarm=Summons a swarm of small seed spirits fallen from the World Tree.
shock_overload=Overloads a lightning charge on the target point: after a short delay it damages and shocks every enemy in the area, then a moment later each shocked enemy bursts, hurting the enemies around it for less damage. Your own units are not hurt.
shock_trap=Places a trap that arms when an enemy walks into its area, then after a short delay stuns every enemy still in the area. It is used up once it goes off and deals no damage.
spirit_bomb=Drains your own units down to half health and channels the stolen health into a beam that strikes the closest enemy in the line, four times. Damage left over from a kill moves on to the next enemy in the line.
storm_rider=Summons a fast wind spirit rider that runs straight for the enemy base and attacks it in melee. It only fights other ground enemies when the base cannot be targeted.
storm_stag=Summons a thunder stag that builds up speed and rams ground enemies, hitting harder the faster it is going. It bolts away after each hit and zaps nearby enemies with small lightning.
thunder_bird_swarm=Summons a flock of fragile thunderbirds that dive onto ground enemies, buildings or the enemy base, hitting harder the farther they fall, then climb back up. They cannot attack flying units.
thunder_spirit=Summons a flying lightning spirit that shoots ground enemies, buildings and the enemy base from range. It cannot attack other flying units.
tidal_warhead=Launches a homing warhead that locks onto the enemy nearest the aimed spot, preferring air targets and using ground targets only if none are flying. It explodes on the first enemy it touches, hurting enemies around the blast, and hits harder against air targets.
tide_call=Calls a water tide that rolls through the field, pushing every enemy ground unit it touches in its direction of travel and dealing only slight damage once to each. It leaves water fields along its path that make any non-water unit wet, your own included, and fades after a short time.
titan_remnant=Builds a titan remnant that stays for a while and, whenever an enemy is in range, thrusts a giant stone fist up under it, damaging enemies around that spot. It leaves a rock remnant if destroyed.
tornado_strike=Sends a tornado drifting slowly from the target point toward the center of the field. It catches ground enemies it touches, spins and lifts them into the air, and damages them more the more it carries.
tower=Builds a human anti-air tower that shoots the closest flying enemy in range and also damages enemies right next to it. It cannot attack ground units.
towerback=Summons a slow MiniRock with an anti-air tower strapped to its back. It walks toward the nearest enemy but always prefers a flyer in reach, shooting it from range with a small splash; against ground enemies it only hits at close range.
tree_golem=Summons a slow, sturdy tree golem that melee-attacks ground enemies and slowly heals itself. It leaves a trail of leaves that heals anyone standing on it, friend or foe, and slows units that are not nature.
vine_colony=Plants a vine colony that raises a vine under the nearest ground enemy in reach every few seconds, damaging and slowing everything the vine touches. The colony can be attacked and fades after a while.
vine_spirit=Summons vine spirits that shoot the nearest enemy, ground or air, from range. Each hit snares the target, slowing it and pulling flying units down, and fire damage tears the snare off for extra damage. Nature enemies are immune.
vine_toss=Erupts a line of vines from the caster toward the target one after another, damaging each enemy ground unit, building or base along the line once and snaring it to slow it down. Units do not block the line, flying units are out of reach, and fire damage on a snared target breaks the snare for extra damage.
vine_world=Plants a giant vine that damages and slows enemies around it at once, then a moment later grows two rings of vines that hit each enemy once more. Each enemy the vines hit leaves you a seed spirit, and your seed spirits touched by the vines grow into vine spirits.
wall_golem=Summons a very sturdy, slow rock golem that attacks only ground enemies and knocks them back. It leaves a rock remnant behind when it is killed.
water_explosion=Erupts a geyser at the target point after a short delay that damages every unit and building in the area, your own included, and launches ground units into the air, heavier ones less. Units thrown up cannot be targeted by ground attackers until they land.
water_slime_swarm=Summons a swarm of water slimes that attack the nearest ground target from a distance and cannot hit flying units. Their trail leaves water fields that make any non-water unit wet, your own included.
will_o_wisp=Fires a will-o'-wisp along the ground that takes control of the first enemy unit it touches, which then fights for you for good. Bases and some buildings cannot be taken over, and the wisp flies on past them.
wind_blade=Launches a wind blade that cuts straight through every enemy ground unit, building and base in its path, dealing less damage to each one it passes, until it leaves the field. It cannot hit flying units.
wind_spirit=Summons a flying wind spirit that waits until an enemy flying unit appears, then dives at the nearest one and explodes, damaging flying enemies around it. It also explodes where it is killed and never attacks ground units or buildings.
wind_totem=Places a wind totem that repeatedly pushes enemy ground units in the area in front of it back toward their own base without damaging them, heavy ones less. It fades after a short time and enemies can destroy it sooner; flying units are not pushed.
zap_mouse=Summons a few lightning spirit mice that run past enemy units to the nearest enemy building and attack it in melee, then go for the enemy base. They never target enemy units.
