# What each magic does, copied from the client's English magic book
# (client Assets/Localization/MagicBook_en.asset, keyed by magic name) for the LLM bot.
aqua_archer=Summons an equipment-wielding water slime archer that attacks ground and flying units from range.
bomb_sprite=Summons a flying sprite that drops bombs on ground targets and blows them up where they land.
boulder_strike=Hurls a boulder that knocks its target back and deals extra damage when the target slams into a wall or another enemy.
bubble_generator=Builds a water slime bubble generator that shields allies.
bubble_spirit=Summons a bubble-wielding water slime that attacks flying units with bursting bubbles.
cannon=Builds a cannon of the human magic civilization that shells ground units.
chain_lightning=Arcs a lightning spirit's bolt that chains between enemies.
chicken_commando=Deploys a paratrooper of the human magic civilization that lands and fights ground enemies.
cloud_dragon=Summons a cloud-scaled wind spirit dragon that dampens the area and attacks enemies.
crater=Leaves a Hellfire Legion ember crater that spits fireballs around it.
dimension_toad=Summons a Boundary Carrier of the dimensional wanderers that alternately opens gates for Cinder Shards and Storm Shards.
dragon_tower=Builds a tower that fires flame shots at both ground and air targets.
earth_call=Shakes a circular area, turning medium rock remnants into Rock Golems and small remnants into MiniRocks.
electric_tower=Builds a human arcane lightning tower that fires bouncing bolts.
ember_spirit_swarm=Summons a swarm of small ember demons of the Hellfire Legion.
evil_ent=Summons an Evil Ent that punches from range and periodically drags in a light enemy to burn it.
fire_lord_spirit=Summons a Hellfire Legion commander that keeps sending out lesser demons to attack enemies.
fire_shot=Fires a hellfire projectile in the target direction.
fire_spirit=Summons a lesser demon of the Hellfire Legion that burns nearby enemies.
firework_tower=Builds a tower that lobs shells and blows up where they land.
frenzy_totem=Drops a Hellfire Legion frenzy totem that makes units in range attack anything, allies included.
grass_generator=Builds a structure that keeps spreading leaf fields around it.
healing_totem=Places a World Tree healing totem that restores allies in range.
leafair=Sends down leaf fairies that repair allied buildings and extend their duration.
life_tree=Plants a World Tree sapling that keeps healing nearby allies.
lightning_drop=Calls down a lightning spirit's thunderbolt onto the target area.
lightning_explosion=Detonates a lightning spirit's charge that shocks nearby enemies.
magma_explosion=Tears open a hellfire magma rift that scorches the area.
magma_spirit=Summons a magma-crusted demon of the Hellfire Legion that burns enemies.
mana_well=Opens a well pooled with World Tree mana that restores your mana.
meteor_shower=Rains hellfire meteors over a wide area.
mini_rock_swarm=Summons a pair of MiniRock twins of the rock golem tribe.
overgrowth=Triggers a World Tree overgrowth that grows small lifeforms larger.
rain_cloud=Summons a cloud that rains over the battlefield.
rallying_totem=Builds a human rally beacon that gathers nearby allies and sends them at enemies around it.
razor_gale=Spins up a wind spirit's razor gale that keeps cutting enemies in the area.
repair_totem=Places a totem that stops nearby allied buildings from decaying.
rock_blast=Detonates every rock remnant in a circular area, creating an explosion centered on each remnant.
rock_drop=Drops a rock golem tribe boulder from the sky.
rock_golem=Summons a mossy warrior of the rock golem tribe that attacks ground enemies up close.
rock_mage=Summons a rune-stone shaman of the rock golem tribe that strikes enemies with two rocks.
rock_rolling=Rolls a rock golem tribe boulder that bounces off enemies and walls.
rock_turret=Builds a small human siege turret that hurls rocks.
sand_storm=Whips up a wind spirit's dust storm that batters enemies in the area.
sea_serpent=Summons a serpent that leaves water fields where it moves and fires a water beam through every enemy in a line.
seed_nest=Builds a nest that keeps sending out seed spirits until it expires.
seed_spirit_swarm=Summons a swarm of small seed spirits fallen from the World Tree.
shock_overload=Overloads a lightning spirit's charge into a heavy shock and an anti-air blast.
shock_trap=Places a trap that arms when an enemy steps in, then stuns the area.
spirit_bomb=Drains your own units down to half health and fires a beam that deals 70% of what it took, split over four hits.
storm_rider=Summons a World Tree wind spirit rider that prioritizes attacking the player.
storm_stag=Summons a thunder stag that charges and attacks enemies.
thunder_bird_swarm=Summons a flock of World Tree thunderbirds that charge at enemies.
thunder_spirit=Summons a lightning spirit born at the World Tree that flies fast and attacks enemies.
tidal_warhead=Fires a warhead that homes in on the nearest air target, or the nearest ground target when there is none.
tide_call=Calls a water slime tide that pushes enemies back and leaves a water trail.
titan_remnant=Summons a titan remnant that remains on the battlefield for a time, periodically erupting a giant stone fist beneath nearby enemies.
tornado_strike=Sends a wind spirit turned tornado sweeping across the field.
tower=Builds a human anti-air arcane tower that deals area damage to flying units.
towerback=Summons a MiniRock strapped with a human-made anti-air tower that attacks flying units.
tree_golem=Summons a slow but sturdy World Tree ancient guardian that fights ground enemies.
vine_colony=Plants a vine colony that keeps sending out vines to fend off enemies.
vine_spirit=Summons a World Tree nature spirit woven from vines that chases down enemies.
vine_toss=Erupts a line of World Tree vines that strike enemies in sequence.
vine_world=Plants a giant vine, then grows two rings of vines around it a moment later.
wall_golem=Summons a large, sturdy rock golem that fights only ground enemies.
water_explosion=Erupts a geyser that damages enemies and launches them into the air.
water_slime_swarm=Summons a swarm of surviving water slimes that leave a water field in their wake.
will_o_wisp=Fires a will-o'-wisp of World Tree mana that seizes control of an enemy.
wind_blade=Launches a crescent wind blade that pierces through enemies.
wind_spirit=Summons a gale wind spirit that rushes at enemies and bursts.
wind_totem=Places a wind spirit's tailwind totem that blows enemies in a fixed direction.
zap_mouse=Summons a cowardly lightning spirit mouse that loves buildings.
