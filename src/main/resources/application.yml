server:
  port: ${PORT:7777}
  external-port: ${EXTERNAL_PORT}
  protocol: ${PROTOCOL}
  domain: ${DOMAIN}
  heartbeat-interval-ms: ${HEARTBEAT_INTERVAL_MS:10000}
  max-sessions: ${MAX_SESSIONS:100}
  # Scheme+host+port other services on the same docker network reach this process at, e.g.
  # http://ac-game-blue:8080. Empty by default so environments that do not set it still boot;
  # ServerStatusService then writes NULL and readers fall back to the public address.
  internal-base-url: ${INTERNAL_BASE_URL:}

# Metrics run on their own port so the public app port never serves /actuator.
# Health and Prometheus endpoints allow unauthenticated scrapes.
# MANAGEMENT_PORT must stay reachable only from the Prometheus host.
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

spring:
  application:
    name: word-online-server
  config:
    import: optional:file:.env[.properties]
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PW}
  # The loop watchdog, the server heartbeat and the bot scheduler are all @Scheduled. Spring's
  # default pool of one thread makes the watchdog wait behind whichever of the others is busy
  # creating sessions, which is exactly when a stuck loop needs reaping.
  task:
    scheduling:
      pool:
        size: ${SCHEDULING_POOL_SIZE:3}

logging:
  discord-webhook-url: ${DISCORD_WEBHOOK_URL}
  level:
    org.springframework.web.socket: WARN
    org.springframework.messaging: WARN
#    com.wordonline.server.game.domain.bot: DEBUG
#    com.wordonline.server.game.service.system: DEBUG

# Self-play bot games. target-games is the number of sessions the scheduler keeps running;
# every check interval it tops the server back up to that number, never past server.max-sessions.
# The default of 1 reproduces the original "one bot game while idle" behaviour. Raise both knobs
# to generate a synthetic load for profiling, e.g. BOT_AUTO_MATCH_TARGET_GAMES=50
# BOT_AUTO_MATCH_CHECK_INTERVAL_MS=5000.
# max-sessions-per-sweep spreads the ramp-up over several sweeps: session creation is synchronous
# on the scheduler thread, so an unbounded top-up holds that thread for the whole batch.
bot:
  auto-match:
    enabled: ${BOT_AUTO_MATCH_ENABLED:true}
    target-games: ${BOT_AUTO_MATCH_TARGET_GAMES:1}
    check-interval-ms: ${BOT_AUTO_MATCH_CHECK_INTERVAL_MS:60000}
    max-sessions-per-sweep: ${BOT_AUTO_MATCH_MAX_SESSIONS_PER_SWEEP:5}
  # Threads the bot ticks run on. pool-size 0 means one thread per available processor; the pool
  # is fixed and the queue bounded so bot threads cannot outnumber the cores that run them. A full
  # queue runs the tick on the calling loop thread, which costs that frame but never drops a tick.
  executor:
    pool-size: ${BOT_EXECUTOR_POOL_SIZE:0}
    queue-capacity: ${BOT_EXECUTOR_QUEUE_CAPACITY:64}

# account mints every JWT this server verifies; the JwtDecoder fetches account's JSON Web
# Key Set from url + /.well-known/jwks (see AccountProperties). No local public key is kept
# here any more, so a cold start needs account reachable, and a running match cannot let a
# player reconnect while account is down.
team6515:
  server:
    account:
      url: ${ACCOUNT_SERVER_URL}

# Outbound calls to the lobby. Without LOBBY_BASE_URL the session-ended notification is
# skipped and the lobby falls back to its reconciler. The service token is issued elsewhere
# and mounted as a file; never commit its value.
lobby:
  base-url: ${LOBBY_BASE_URL:}
  service-token-path: ${JWT_FILE_PATH:}
  request-timeout: ${LOBBY_REQUEST_TIMEOUT_MS:1000}
  max-attempts: ${LOBBY_MAX_ATTEMPTS:2}

# Operational alerts. The webhook is the one the log appender already uses; leaving
# DISCORD_WEBHOOK_URL unset disables alerting. cooldown is how long an ongoing episode stays
# quiet after its first message - a server past capacity has dozens of slow loops on every
# sweep and one problem.
alert:
  enabled: ${ALERT_ENABLED:true}
  discord-webhook-url: ${DISCORD_WEBHOOK_URL:}
  fps-threshold: ${ALERT_FPS_THRESHOLD:15}
  cooldown: ${ALERT_COOLDOWN:5m}

# Loop watchdog. A session whose last completed frame is older than stuck-threshold is
# reaped: recorded as ABANDONED (with the loop thread's stack trace), reported to the
# lobby, and removed from the session registry.
watchdog:
  check-interval-ms: ${WATCHDOG_CHECK_INTERVAL_MS:5000}
  stuck-threshold: ${WATCHDOG_STUCK_THRESHOLD:10s}
